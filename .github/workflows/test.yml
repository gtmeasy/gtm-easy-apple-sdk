name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  swiftpm:
    name: swift build + test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test

  ios-sample:
    name: ios sample (xcodebuild)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: xcodebuild iOS sample
        working-directory: examples
        run: |
          xcodebuild \
            -workspace TwilarSample.xcworkspace \
            -scheme TwilarSample \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
